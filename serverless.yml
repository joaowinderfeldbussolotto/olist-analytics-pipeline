service: olist-analytics-pipeline

frameworkVersion: '3'

provider:
  name: aws
  runtime: python3.11
  region: us-east-1
  stage: ${opt:stage, 'dev'}
  environment:
    BUCKET_NAME: ${self:custom.bucketName}
    GLUE_JOB_NAME: ${self:custom.glueJobName}

  iam:
    role: arn:aws:iam::${aws:accountId}:role/LabRole

plugins:
  - serverless-glue
  - serverless-step-functions

package:
  individually: false
  patterns:
    - '!**/*'
    - 'lambda/**'
    - '!lambda/**/__pycache__/**'
    - '!lambda/**/*.pyc'

custom:
  bucketName: olist-datalake-${aws:accountId}-${self:provider.stage}
  glueScriptsBucket: olist-glue-scripts-${aws:accountId}-${self:provider.stage}
  athenaResultsBucket: olist-athena-results-${aws:accountId}-${self:provider.stage}
  glueJobName: olist-etl-${self:provider.stage}
  redshiftWorkgroup: olist-redshift-workgroup
  redshiftDatabase: olistdb
  glueRoleArn: arn:aws:iam::${aws:accountId}:role/LabRole
  
functions:
  ingest:
    handler: lambda/ingest/handler.lambda_handler
    timeout: 300
    memorySize: 512
    events:
      - schedule:
          name: olist-daily-schedule
          description: 'Execução diária às 02:00 UTC'
          rate: cron(0 2 * * ? *)
          enabled: true

# =====================================================
# CONFIGURAÇÃO GLUE PLUGIN
# =====================================================
Glue:
  bucketDeploy: ${self:custom.glueScriptsBucket}
  createBucket: true  # Plugin cria o bucket ANTES de fazer upload dos scripts
  s3Prefix: scripts/
  tempDirBucket: ${self:custom.glueScriptsBucket}
  tempDirS3Prefix: temp/
  
  jobs:
    - name: ${self:custom.glueJobName}
      scriptPath: glue/olist_etl.py
      type: spark
      glueVersion: python3-5.0
      role: ${self:custom.glueRoleArn}
      WorkerType: G.1X
      NumberOfWorkers: 2
      Timeout: 120
      MaxRetries: 1
      MaxConcurrentRuns: 1
      DefaultArguments:
        --enable-metrics: 'true'
        --enable-spark-ui: 'true'
        --enable-glue-datacatalog: 'true'
        --enable-continuous-cloudwatch-log: 'true'
        --job-language: 'python'
        --extra-py-files: 's3://${self:custom.glueScriptsBucket}/libs/'
        --additional-python-modules: 'boto3==1.41.5,botocore==1.41.5,transformers,torch,sentencepiece,accelerate'
        customArguments:
          bucket_name: ${self:custom.bucketName}
          redshift_workgroup: ${self:custom.redshiftWorkgroup}
          redshift_database: ${self:custom.redshiftDatabase}
      Tags:
        Project: Olist
        Environment: ${self:provider.stage}


resources:
  Resources:
    # S3 Bucket - Data Lake
    DataLakeBucket:
      Type: AWS::S3::Bucket
      Properties:
        BucketName: ${self:custom.bucketName}
        PublicAccessBlockConfiguration:
          BlockPublicAcls: true
          BlockPublicPolicy: true
          IgnorePublicAcls: true
          RestrictPublicBuckets: true
        VersioningConfiguration:
          Status: Enabled
        LifecycleConfiguration:
          Rules:
            - Id: DeleteOldMetadata
              Status: Enabled
              Prefix: raw/_metadata/
              ExpirationInDays: 30
            - Id: DeleteOldLogs
              Status: Enabled
              Prefix: logs/
              ExpirationInDays: 7
    
    # S3 Bucket - Athena Query Results
    AthenaResultsBucket:
      Type: AWS::S3::Bucket
      Properties:
        BucketName: ${self:custom.athenaResultsBucket}
        PublicAccessBlockConfiguration:
          BlockPublicAcls: true
          BlockPublicPolicy: true
          IgnorePublicAcls: true
          RestrictPublicBuckets: true
        LifecycleConfiguration:
          Rules:
            - Id: DeleteOldQueryResults
              Status: Enabled
              ExpirationInDays: 30

    # =====================================================
    # GLUE DATABASE
    # =====================================================
    OlistGlueDatabase:
      Type: AWS::Glue::Database
      Properties:
        CatalogId: !Ref AWS::AccountId
        DatabaseInput:
          Name: olist_datalake_${self:provider.stage}
          Description: Database do Data Lake Olist - Camada Processed
          LocationUri: s3://${self:custom.bucketName}/processed/

    # =====================================================
    # GLUE CRAWLER
    # =====================================================
    OlistProcessedCrawler:
      Type: AWS::Glue::Crawler
      DependsOn: OlistGlueDatabase
      Properties:
        Name: olist-processed-crawler-${self:provider.stage}
        Role: arn:aws:iam::${aws:accountId}:role/LabRole
        DatabaseName: olist_datalake_${self:provider.stage}
        Description: Crawler para catalogar dados processados do Olist
        Targets:
          S3Targets:
            - Path: s3://${self:custom.bucketName}/processed/
              Exclusions:
                - '**/_temporary/**'
                - '**/_spark_metadata/**'
                - '**/.spark-staging/**'
        SchemaChangePolicy:
          UpdateBehavior: UPDATE_IN_DATABASE
          DeleteBehavior: LOG
        RecrawlPolicy:
          RecrawlBehavior: CRAWL_EVERYTHING
        TablePrefix: 'olist_'
        Tags:
          Project: Olist
          Environment: ${self:provider.stage}

stepFunctions:
  stateMachines:
    olistAnalyticsPipeline:
      name: olist-analytics-pipeline-${self:provider.stage}
      role: arn:aws:iam::${aws:accountId}:role/LabRole
      definition:
        Comment: Orquestração Lambda -> Glue -> Crawler
        StartAt: Lambda Invoke
        States:
          Lambda Invoke:
            Type: Task
            Resource: arn:aws:states:::lambda:invoke
            Parameters:
              FunctionName: arn:aws:lambda:${self:provider.region}:${aws:accountId}:function:${self:service}-${self:provider.stage}-ingest:$LATEST
              Payload.$: $
            Retry:
              - ErrorEquals:
                  - Lambda.ServiceException
                  - Lambda.AWSLambdaException
                  - Lambda.SdkClientException
                  - Lambda.TooManyRequestsException
                IntervalSeconds: 1
                MaxAttempts: 3
                BackoffRate: 2
            ResultSelector:
              Payload.$: $.Payload
            ResultPath: $.lambda
            Next: Glue StartJobRun
          Glue StartJobRun:
            Type: Task
            Resource: arn:aws:states:::glue:startJobRun.sync
            Parameters:
              JobName: ${self:custom.glueJobName}
              Arguments:
                --execution_id.$: $$.Execution.Id
                --bucket_name: ${self:custom.bucketName}
                --redshift_workgroup: ${self:custom.redshiftWorkgroup}
                --redshift_database: ${self:custom.redshiftDatabase}
            ResultPath: $.glue
            Next: StartCrawler
          StartCrawler:
            Type: Task
            Resource: arn:aws:states:::aws-sdk:glue:startCrawler
            Parameters:
              Name: olist-processed-crawler-${self:provider.stage}
            End: true

  Outputs:
    BucketName:
      Value: !Ref DataLakeBucket
      Description: Nome do S3 Bucket do Data Lake
    
    BucketArn:
      Value: !GetAtt DataLakeBucket.Arn
      Description: ARN do S3 Bucket
    
    GlueScriptsBucketName:
      Value: ${self:custom.glueScriptsBucket}
      Description: Nome do S3 Bucket para scripts Glue (criado pelo plugin)
    
    AthenaResultsBucketName:
      Value: !Ref AthenaResultsBucket
      Description: Nome do S3 Bucket para resultados de queries do Athena
    
    AthenaResultsBucketArn:
      Value: !GetAtt AthenaResultsBucket.Arn
      Description: ARN do S3 Bucket do Athena
    
    GlueJobName:
      Value: ${self:custom.glueJobName}
      Description: Nome do Glue Job
    
    GlueRoleArn:
      Value: arn:aws:iam::${aws:accountId}:role/LabRole
      Description: ARN da IAM Role do Glue Job (LabRole)
    
    GlueDatabaseName:
      Value: olist_datalake_${self:provider.stage}
      Description: Nome do Glue Database
    
    GlueCrawlerName:
      Value: !Ref OlistProcessedCrawler
      Description: Nome do Glue Crawler
